<style>
.rotating-ring { transform-origin: 450px 450px; animation: ring-turn 60s linear infinite; }
@keyframes ring-turn { to { transform: rotate(360deg); } }
.hero-theme-icon, .theme-labels text { animation: theme-glow 7s ease-in-out infinite; }
.icon-0, .glow-blue { --glow: #7CC4E8; }
.icon-1, .glow-green { --glow: #8BC9A5; animation-delay: -2.3s; }
.icon-2, .glow-orange { --glow: #E6B56A; animation-delay: -4.6s; }
@keyframes theme-glow {
  0%,100% { opacity: .72; filter: drop-shadow(0 0 0px var(--glow)); }
  45%,55% { opacity: 1; filter: drop-shadow(0 0 7px var(--glow)); }
}
@media (prefers-reduced-motion: reduce) {
 .rotating-ring, .hero-theme-icon, .theme-labels text { animation: none; filter: none; opacity: 1; }
}
